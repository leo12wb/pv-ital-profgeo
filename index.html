<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Professor de Geografia – Estudo para Concurso</title>
<style>
:root{
  --ace-primary:#1e3a5f;--ace-secondary:#1d4ed8;--ciano:#2563eb;--azul:#3b82f6;
  --bg:#eff6ff;--card:#fff;--text:#1a1a1a;--muted:#6b7280;--border:#dbeafe;
  --shadow:0 2px 8px rgba(0,0,0,.08);--radius:12px;
}
[data-dark]{
  --bg:#0a0a0a;--card:#111;--text:#f0f0f0;--muted:#9ca3af;--border:#1f2937;
  --shadow:0 2px 8px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .3s,color .3s}
header{background:linear-gradient(135deg,#0f172a,#1e3a5f,#1d4ed8);padding:18px 20px 14px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.3)}
.hdr-row{display:flex;align-items:center;gap:12px;max-width:900px;margin:0 auto}
.badge{background:#fff2;color:#fff;font-size:.7rem;font-weight:700;padding:3px 8px;border-radius:20px;border:1px solid #fff4;letter-spacing:.5px}
.hdr-titles h1{font-size:1.1rem;font-weight:700;color:#fff;line-height:1.2}
.hdr-titles p{font-size:.72rem;color:#bfdbfe;margin-top:2px}
.hdr-actions{margin-left:auto;display:flex;gap:8px}
.hdr-btn{background:#fff2;border:1px solid #fff3;color:#fff;padding:6px 10px;border-radius:8px;cursor:pointer;font-size:.75rem;transition:background .2s}
.hdr-btn:hover{background:#fff3}
.speed-group{display:flex;border:1px solid #fff3;border-radius:8px;overflow:hidden}
.speed-btn{background:#fff2;border:none;border-right:1px solid #fff3;color:#fff;padding:6px 9px;cursor:pointer;font-size:.72rem;font-weight:600;transition:background .2s}
.speed-btn:last-child{border-right:none}
.speed-btn:hover{background:#fff3}
.speed-btn.ativo{background:#fff4;font-weight:800}
.tabs-wrap{background:var(--card);border-bottom:2px solid var(--border);position:sticky;top:72px;z-index:90}
.tabs{display:flex;gap:0;max-width:900px;margin:0 auto;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:12px 16px;cursor:pointer;font-size:.82rem;font-weight:600;color:var(--muted);white-space:nowrap;border-bottom:3px solid transparent;transition:all .2s}
.tab.ativo{color:var(--ace-primary);border-bottom-color:var(--ace-primary)}
.tab:hover:not(.ativo){color:var(--ace-secondary)}
.content{max-width:900px;margin:0 auto;padding:16px}
.secao{display:none}.secao.ativa{display:block}
.disc-bloco{background:var(--card);border-radius:var(--radius);margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden}
.disc-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer;background:var(--ace-primary);color:#fff;font-weight:600;font-size:.9rem;user-select:none}
.disc-header:hover{opacity:.92}
.disc-header .arrow{transition:transform .3s;font-size:.8rem}
.disc-header.open .arrow{transform:rotate(180deg)}
.disc-topicos{display:none;padding:0}
.disc-topicos.open{display:block}
.topico-item{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:10px}
.topico-item:last-child{border-bottom:none}
.freq-badge{font-size:.65rem;padding:2px 7px;border-radius:10px;font-weight:700;white-space:nowrap;margin-top:2px}
.freq-alto{background:#dbeafe;color:#1e3a5f}
.freq-medio{background:#eff6ff;color:#1d4ed8}
.freq-baixo{background:#f0f9ff;color:#0369a1}
.topico-nome{font-weight:600;font-size:.85rem;margin-bottom:3px}
.topico-desc{font-size:.78rem;color:var(--muted);line-height:1.5}
.flash-ctrl{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.flash-ctrl select,.flash-ctrl button{padding:8px 14px;border-radius:8px;border:1px solid var(--border);font-size:.82rem;cursor:pointer;background:var(--card);color:var(--text)}
.flash-ctrl button{background:var(--ace-primary);color:#fff;border:none;font-weight:600}
.flash-ctrl button:hover{background:var(--ace-secondary)}
.flash-prog{font-size:.8rem;color:var(--muted);margin-left:auto}
.flash-box{perspective:1000px;margin:0 auto 16px}
.flash-inner{position:relative;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.flash-inner.virado{transform:rotateY(180deg)}
.flash-frente,.flash-verso{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);backface-visibility:hidden;padding:32px 24px;text-align:center;min-height:200px;display:flex;flex-direction:column;justify-content:center;align-items:center}
.flash-verso{position:absolute;top:0;left:0;width:100%;transform:rotateY(180deg);background:linear-gradient(135deg,#0f172a,#1e3a5f)}
.flash-frente .label{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.flash-frente .termo{font-size:1.4rem;font-weight:700;color:var(--ace-primary)}
.flash-verso .label{font-size:.7rem;color:#bfdbfe;text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.flash-verso .def{font-size:.88rem;color:#fff;line-height:1.6}
.flash-nav{display:flex;justify-content:center;gap:12px}
.flash-nav button{padding:9px 20px;border-radius:8px;border:none;cursor:pointer;font-weight:600;font-size:.82rem}
.btn-ant{background:var(--border);color:var(--text)}
.btn-prox{background:var(--ace-primary);color:#fff}
.btn-prox:hover{background:var(--ace-secondary)}
.mapa-filtros{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.mapa-filtros button{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:.78rem;cursor:pointer}
.mapa-filtros button.ativo{background:var(--ace-primary);color:#fff;border-color:var(--ace-primary)}
.mapa-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.mapa-card{background:var(--card);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);border-left:4px solid var(--ace-primary);cursor:pointer;transition:transform .15s}
.mapa-card:hover{transform:translateY(-2px)}
.mapa-card .mc-disc{font-size:.65rem;color:var(--muted);text-transform:uppercase;margin-bottom:4px}
.mapa-card .mc-nome{font-size:.82rem;font-weight:600;margin-bottom:4px}
.mapa-card .mc-freq{font-size:.65rem}
.quiz-ctrl{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.quiz-ctrl select{padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:.82rem}
.quiz-ctrl button{padding:8px 18px;border-radius:8px;border:none;background:var(--ace-primary);color:#fff;font-weight:600;cursor:pointer;font-size:.82rem}
.quiz-ctrl button:hover{background:var(--ace-secondary)}
.quiz-box{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.quiz-info{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.quiz-badge{padding:4px 12px;border-radius:20px;font-size:.72rem;font-weight:700}
.qbadge-disc{background:#dbeafe;color:#1e3a5f}
.qbadge-num{background:#eff6ff;color:#1e40af;border:1px solid var(--border)}
.qbadge-tema{background:#1b766c;color:#fff}
[data-dark] .qbadge-disc{background:#1e3a5f;color:#bfdbfe}
[data-dark] .qbadge-num{background:#1e3a5f;color:#bfdbfe}
[data-dark] .qbadge-tema{background:#0f4a44;color:#5eead4}
.quiz-video{margin-top:14px}
.qvid-iframe{width:100%;height:315px;border:none;display:block;border-radius:12px;margin-top:10px}
.quiz-pergunta{font-size:.95rem;font-weight:600;line-height:1.6;margin-bottom:16px}
.quiz-ops{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.quiz-op{padding:11px 14px;border-radius:8px;border:1px solid var(--border);background:var(--bg);cursor:pointer;font-size:.84rem;text-align:left;transition:background .15s,border-color .15s;display:flex;align-items:flex-start;gap:8px}
.quiz-op:hover:not(:disabled){background:#dbeafe;border-color:var(--ace-primary)}
.quiz-op.correta{background:#dbeafe;border-color:#1e3a5f;font-weight:600}
.quiz-op.errada{background:#fee2e2;border-color:#dc2626}
.quiz-explicacao{background:#eff6ff;border-left:4px solid var(--ace-primary);padding:12px 14px;border-radius:0 8px 8px 0;font-size:.82rem;line-height:1.6;margin-bottom:14px;display:none}
[data-dark] .quiz-explicacao{background:#1e3a5f}
.quiz-explicacao.show{display:block}
.quiz-nav{display:flex;gap:8px;flex-wrap:wrap}
.quiz-nav button{padding:8px 18px;border-radius:8px;border:none;cursor:pointer;font-size:.82rem;font-weight:600}
.btn-prox-q{background:var(--ace-primary);color:#fff}
.btn-prox-q:hover{background:var(--ace-secondary)}
.quiz-placar{text-align:center;padding:24px;display:none}
.quiz-placar.show{display:block}
.placar-num{font-size:3rem;font-weight:800;color:var(--ace-primary)}
.placar-label{color:var(--muted);font-size:.88rem;margin-bottom:16px}
.exames-lista{display:grid;gap:10px}
.exame-card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.exame-info h3{font-size:.9rem;font-weight:700;margin-bottom:4px}
.exame-info p{font-size:.75rem;color:var(--muted)}
.btn-iniciar{padding:8px 18px;border-radius:8px;border:none;background:var(--ace-primary);color:#fff;font-weight:600;cursor:pointer;font-size:.82rem}
.btn-iniciar:hover{background:var(--ace-secondary)}
.exame-ativo{display:none}
.exame-ativo.show{display:block}
.ex-header{background:var(--ace-primary);color:#fff;border-radius:var(--radius);padding:14px 16px;margin-bottom:14px}
.ex-header h2{font-size:.95rem;font-weight:700}
.ex-header p{font-size:.75rem;color:#bfdbfe;margin-top:3px}
.ex-secao-label{font-size:.78rem;font-weight:700;color:var(--ace-primary);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.ex-pergunta{font-size:.9rem;font-weight:600;line-height:1.6;margin-bottom:14px}
.ex-ops{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}
.ex-op{padding:10px 14px;border-radius:8px;border:1px solid var(--border);background:var(--bg);cursor:pointer;font-size:.82rem;text-align:left;transition:all .15s;display:flex;gap:8px;align-items:flex-start}
.ex-op:hover:not(:disabled){background:#dbeafe;border-color:var(--ace-primary)}
.ex-op.selecionada{background:#dbeafe;border-color:var(--ace-primary);font-weight:600}
.ex-op.correta{background:#dbeafe;border-color:#1e3a5f}
.ex-op.errada{background:#fee2e2;border-color:#dc2626}
.ex-explicacao{background:#eff6ff;border-left:4px solid var(--ace-primary);padding:12px;border-radius:0 8px 8px 0;font-size:.8rem;line-height:1.6;margin-bottom:12px;display:none}
[data-dark] .ex-explicacao{background:#1e3a5f}
.ex-explicacao.show{display:block}
.ex-nav{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap}
.ex-nav button{padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-size:.8rem;font-weight:600}
.audio-btn{background:none;border:1px solid var(--border);border-radius:6px;padding:3px 7px;cursor:pointer;font-size:.82rem;color:var(--ace-primary);flex-shrink:0;transition:background .15s}
.audio-btn:hover{background:var(--border)}
.audio-btn-op{background:none;border:none;cursor:pointer;font-size:.78rem;padding:0 2px;opacity:.5;flex-shrink:0;transition:opacity .15s}
.audio-btn-op:hover{opacity:1}
.btn-ex-prox{background:var(--ace-primary);color:#fff}
.btn-ex-prox:hover{background:var(--ace-secondary)}
.btn-ex-voltar{background:var(--border);color:var(--text)}
.ex-resultado{display:none;text-align:center;padding:28px}
.ex-resultado.show{display:block}
.ex-res-num{font-size:3.5rem;font-weight:800;color:var(--ace-primary)}
.ex-res-label{color:var(--muted);font-size:.9rem;margin-bottom:20px}
.relatorio-box{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:14px}
.relatorio-box h3{font-size:.9rem;font-weight:700;margin-bottom:14px;color:var(--ace-primary)}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.stat-card{background:var(--bg);border-radius:10px;padding:14px;text-align:center;border:1px solid var(--border)}
.stat-num{font-size:1.8rem;font-weight:800;color:var(--ace-primary)}
.stat-label{font-size:.72rem;color:var(--muted);margin-top:2px}
.btn-exportar{padding:10px 20px;border-radius:8px;border:none;background:var(--ciano);color:#fff;font-weight:600;cursor:pointer;font-size:.84rem}
.btn-exportar:hover{opacity:.88}
.btn-limpar{padding:10px 20px;border-radius:8px;border:none;background:#dc2626;color:#fff;font-weight:600;cursor:pointer;font-size:.84rem;margin-left:8px}
#toast{position:fixed;bottom:24px;right:24px;background:#1a1a1a;color:#fff;padding:12px 20px;border-radius:10px;font-size:.82rem;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9999;max-width:280px}
#toast.show{opacity:1}
[data-dark] .disc-topicos,.disc-topicos{background:var(--card)}
[data-dark] .quiz-op,[data-dark] .ex-op{background:var(--bg);color:var(--text)}
[data-dark] .freq-alto{background:#1e3a5f;color:#bfdbfe}
[data-dark] .freq-medio{background:#1e3a8a;color:#93c5fd}
[data-dark] .freq-baixo{background:#0c4a6e;color:#7dd3fc}
@media(max-width:600px){
  .flash-frente .termo{font-size:1.1rem}
  .hdr-titles h1{font-size:.95rem}
  .tab{padding:10px 12px;font-size:.76rem}
}
</style>
</head>
<body>

<header>
  <div class="hdr-row">
    <span class="badge">GEO</span>
    <div class="hdr-titles">
      <h1>Professor de Geografia</h1>
      <p>Língua Portuguesa · Informática · Conhecimentos Específicos</p>
    </div>
    <div class="hdr-actions">
      <div class="speed-group">
        <button class="speed-btn ativo" onclick="setSpeed(1,this)">1×</button>
        <button class="speed-btn" onclick="setSpeed(1.5,this)">1.5×</button>
        <button class="speed-btn" onclick="setSpeed(2,this)">2×</button>
      </div>
      <button class="hdr-btn" onclick="toggleDark()">🌙</button>
      <button class="hdr-btn" onclick="falarCard()">🔊</button>
    </div>
  </div>
</header>

<div class="tabs-wrap">
  <div class="tabs">
    <div class="tab ativo" onclick="mudarTab('resumo',this)">📚 Resumo</div>
    <div class="tab" onclick="mudarTab('flash',this)">🃏 Flashcards</div>
    <div class="tab" onclick="mudarTab('mapa',this)">🗺️ Mapa</div>
    <div class="tab" onclick="mudarTab('quiz',this)">❓ Quiz</div>
    <div class="tab" onclick="mudarTab('simulados',this)">📝 Simulados</div>
    <div class="tab" onclick="mudarTab('relatorio',this)">📊 Relatório</div>
  </div>
</div>

<div class="content">

  <div id="sec-resumo" class="secao ativa"></div>

  <div id="sec-flash" class="secao">
    <div class="flash-ctrl">
      <select id="flash-filtro" onchange="filtrarFlash()">
        <option value="todos">Todas as disciplinas</option>
      </select>
      <button onclick="shuffleFlash()">🔀 Embaralhar</button>
      <span class="flash-prog" id="flash-prog"></span>
    </div>
    <div class="flash-box" style="width:100%">
      <div class="flash-inner" id="flash-inner" onclick="virarCard()">
        <div class="flash-frente" id="flash-frente">
          <div class="label">TERMO</div>
          <div class="termo" id="flash-termo"></div>
          <div style="font-size:.72rem;color:var(--muted);margin-top:16px">Clique para ver a definição</div>
        </div>
        <div class="flash-verso" id="flash-verso">
          <div class="label">DEFINIÇÃO</div>
          <div class="def" id="flash-def"></div>
        </div>
      </div>
    </div>
    <div class="flash-nav">
      <button class="btn-ant" onclick="navFlash(-1)">← Anterior</button>
      <button class="btn-prox" onclick="navFlash(1)">Próximo →</button>
    </div>
  </div>

  <div id="sec-mapa" class="secao">
    <div class="mapa-filtros" id="mapa-filtros"></div>
    <div class="mapa-grid" id="mapa-grid"></div>
  </div>

  <div id="sec-quiz" class="secao">
    <div class="quiz-ctrl">
      <select id="quiz-filtro">
        <option value="todos">Todas as disciplinas</option>
        <option value="Português">Língua Portuguesa</option>
        <option value="Informática">Conhecimentos em Informática</option>
        <option value="Geografia">Conhecimentos Específicos</option>
      </select>
      <button onclick="iniciarQuiz()">▶ Iniciar Quiz</button>
    </div>
    <div class="quiz-box" id="quiz-box" style="display:none">
      <div class="quiz-info">
        <span class="quiz-badge qbadge-disc" id="q-disc"></span>
        <span class="quiz-badge qbadge-tema" id="q-tema"></span>
        <span class="quiz-badge qbadge-num" id="q-num"></span>
      </div>
      <div class="quiz-pergunta" id="q-pergunta"></div>
      <div class="quiz-ops" id="q-ops"></div>
      <div class="quiz-explicacao" id="q-exp"></div>
      <div class="quiz-video" id="q-video-wrap" style="display:none"></div>
      <div class="quiz-nav">
        <button class="btn-prox-q" id="btn-prox-q" onclick="proximaQuestao()" style="display:none">Próxima →</button>
      </div>
    </div>
    <div class="quiz-placar" id="quiz-placar">
      <div class="placar-num" id="placar-num"></div>
      <div class="placar-label" id="placar-label"></div>
      <button onclick="iniciarQuiz()" style="padding:10px 24px;border-radius:8px;border:none;background:var(--ace-primary);color:#fff;font-weight:600;cursor:pointer;font-size:.85rem">Novo Quiz</button>
    </div>
  </div>

  <div id="sec-simulados" class="secao">
    <div id="exames-lista" class="exames-lista"></div>
    <div id="exame-ativo" class="exame-ativo">
      <div class="ex-header">
        <h2 id="ex-titulo"></h2>
        <p id="ex-info"></p>
      </div>
      <div id="ex-corpo">
        <div class="ex-secao-label" id="ex-sec-label"></div>
        <div class="ex-pergunta" id="ex-pergunta"></div>
        <div class="ex-ops" id="ex-ops"></div>
        <div class="ex-explicacao" id="ex-exp"></div>
        <div class="ex-nav">
          <button class="btn-ex-voltar" onclick="voltarExames()">← Sair</button>
          <button class="btn-ex-prox" id="btn-ex-prox" onclick="avancarExame()">Próxima →</button>
        </div>
      </div>
      <div class="ex-resultado" id="ex-resultado">
        <div class="ex-res-num" id="ex-res-num"></div>
        <div class="ex-res-label" id="ex-res-label"></div>
        <button onclick="voltarExames()" style="padding:10px 24px;border-radius:8px;border:none;background:var(--ace-primary);color:#fff;font-weight:600;cursor:pointer">Voltar</button>
      </div>
    </div>
  </div>

  <div id="sec-relatorio" class="secao">
    <div class="relatorio-box">
      <h3>📊 Estatísticas Gerais</h3>
      <div class="stats-grid" id="stats-grid"></div>
      <button class="btn-exportar" onclick="exportarTXT()">⬇ Exportar TXT</button>
      <button class="btn-limpar" onclick="limparDados()">🗑 Limpar Dados</button>
    </div>
    <div class="relatorio-box" id="horario-box"></div>
  </div>

</div>

<div id="toast"></div>

<script>
const disciplinas = [
  {
    nome:"📖 Língua Portuguesa",
    cor:"linear-gradient(135deg,#1e3a5f,#1d4ed8)",
    topicos:[
      {t:"Interpretação de Texto",d:"Intelecção de textos denotativos e/ou conotativos. Intertextualidade: diálogo entre textos distintos. Identificar tema, ideia central, inferências e recursos argumentativos.",freq:"alto"},
      {t:"Ortografia e Acentuação",d:"Acentuação gráfica e prosódica. Ortografia segundo o novo acordo ortográfico (2009). Regras de acentuação de oxítonas, paroxítonas e proparoxítonas.",freq:"alto"},
      {t:"Uso da Crase",d:"Regras obrigatórias, proibidas e facultativas. Locução prepositiva + artigo feminino. Casos especiais com pronomes e palavras no plural.",freq:"alto"},
      {t:"Pontuação",d:"Uso da vírgula, ponto e vírgula, dois pontos, travessão, reticências e parênteses. Separação de adjunto adverbial deslocado, aposto e orações intercaladas.",freq:"medio"},
      {t:"Morfologia – Classes Gramaticais",d:"Classes variáveis: artigo, adjetivo, numeral, pronome, substantivo e verbo. Classes invariáveis: advérbio, conjunção, preposição e interjeição. Funções e flexões.",freq:"medio"},
      {t:"Sintaxe e Concordância",d:"Concordância verbal e nominal. Sujeito simples, composto, oculto e indeterminado. Termos da oração: essenciais, integrantes e acessórios. Frase, oração e período.",freq:"alto"},
      {t:"Colocação Pronominal e Regência",d:"Próclise, mesóclise e ênclise. Regência verbal: verbos que exigem preposição. Regência nominal. Análise morfossintática em situações contextuais.",freq:"medio"},

function renderResumo(){
  const el = document.getElementById('sec-resumo');
  el.innerHTML = disciplinas.map((d,i)=>`
    <div class="disc-bloco">
      <div class="disc-header" onclick="toggleDisc(${i},this)" style="background:${d.cor}">
        ${d.nome} <span class="arrow">▼</span>
      </div>
      <div class="disc-topicos" id="disc-${i}">
        ${d.topicos.map(t=>`
          <div class="topico-item">
            <div style="flex:1">
              <div class="topico-nome">${t.t}</div>
              <div class="topico-desc">${t.d}</div>
            </div>
            <span class="freq-badge freq-${t.freq}">${t.freq.toUpperCase()}</span>
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');
}

function toggleDisc(i,hdr){
  const el = document.getElementById('disc-'+i);
  const open = el.classList.toggle('open');
  hdr.classList.toggle('open',open);
}

function buildFlashDados(){
  flashDados=[];
  disciplinas.forEach(d=>{
    d.topicos.forEach(t=>{
      flashDados.push({disc:d.nome, termo:t.t, def:t.d, freq:t.freq});
    });
  });
  flashDeck=[...flashDados];
}

function renderFlashFiltro(){
  const sel = document.getElementById('flash-filtro');
  disciplinas.forEach(d=>{
    const op = document.createElement('option');
    op.value = d.nome;
    op.textContent = d.nome.replace(/^.{2}/,'');
    sel.appendChild(op);
  });
}

function filtrarFlash(){
  const v = document.getElementById('flash-filtro').value;
  flashDeck = v==='todos' ? [...flashDados] : flashDados.filter(f=>f.disc===v);
  flashIdx=0;
  renderFlash();
}

function shuffleFlash(){
  for(let i=flashDeck.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [flashDeck[i],flashDeck[j]]=[flashDeck[j],flashDeck[i]];
  }
  flashIdx=0;
  document.getElementById('flash-inner').classList.remove('virado');
  renderFlash();
  toast('Embaralhado!');
}

function renderFlash(){
  if(!flashDeck.length) return;
  const c = flashDeck[flashIdx];
  document.getElementById('flash-termo').textContent = c.termo;
  document.getElementById('flash-def').textContent = c.def;
  document.getElementById('flash-prog').textContent = `${flashIdx+1} / ${flashDeck.length}`;
  document.getElementById('flash-inner').classList.remove('virado');
}

function virarCard(){
  document.getElementById('flash-inner').classList.toggle('virado');
}

function navFlash(d){
  flashIdx = (flashIdx+d+flashDeck.length)%flashDeck.length;
  renderFlash();
}

function falarCard(){
  const virado = document.getElementById('flash-inner').classList.contains('virado');
  const txt = virado ? document.getElementById('flash-def').textContent : document.getElementById('flash-termo').textContent;
  falar(txt);
}

function falar(txt){
  if(!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(txt);
  u.lang='pt-BR'; u.rate=_speechRate;
  speechSynthesis.speak(u);
}

function renderMapa(){
  const filtros = document.getElementById('mapa-filtros');
  const nomes = ['Todos',...disciplinas.map(d=>d.nome)];
  filtros.innerHTML = nomes.map((n,i)=>`<button class="${i===0?'ativo':''}" onclick="filtrarMapa(this,'${n}')">${n}</button>`).join('');
  _renderMapaGrid('Todos');
}

function filtrarMapa(btn,disc){
  document.querySelectorAll('.mapa-filtros button').forEach(b=>b.classList.remove('ativo'));
  btn.classList.add('ativo');
  _renderMapaGrid(disc);
}

function _renderMapaGrid(disc){
  const grid = document.getElementById('mapa-grid');
  let items=[];
  disciplinas.forEach(d=>{
    if(disc==='Todos'||d.nome===disc){
      d.topicos.forEach(t=>items.push({disc:d.nome,t}));
    }
  });
  grid.innerHTML = items.map(({disc,t})=>`
    <div class="mapa-card" onclick="toast('${t.t}')">
      <div class="mc-disc">${disc.replace(/^.{2}/,'')}</div>
      <div class="mc-nome">${t.t}</div>
      <span class="freq-badge freq-${t.freq} mc-freq">${t.freq.toUpperCase()}</span>
    </div>
  `).join('');
}

  const filtro = document.getElementById('quiz-filtro').value;
  let banco = filtro==='todos' ? [...questoes] : questoes.filter(q=>q.disc===filtro);
  for(let i=banco.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[banco[i],banco[j]]=[banco[j],banco[i]];}
  quizPerguntas = banco.slice(0,Math.min(10,banco.length));
  quizIdx=0; quizCertas=0; quizErradas=0; respondeu=false;
  document.getElementById('quiz-placar').classList.remove('show');
  document.getElementById('quiz-box').style.display='block';
  renderQuestao();
}

function renderQuestao(){
  if(quizIdx>=quizPerguntas.length){encerrarQuiz();return;}
  respondeu=false;
  const q = quizPerguntas[quizIdx];
  document.getElementById('q-disc').textContent = q.disc;
  const temaEl = document.getElementById('q-tema');
  temaEl.textContent = q.tema || '';
  temaEl.style.display = q.tema ? '' : 'none';
  document.getElementById('q-num').textContent = `${quizIdx+1}/${quizPerguntas.length}`;
  document.getElementById('q-pergunta').textContent = q.p;
  document.getElementById('q-exp').classList.remove('show');
  document.getElementById('btn-prox-q').style.display='none';
  const ops = document.getElementById('q-ops');
  ops.innerHTML = q.ops.map((o,i)=>`
    <button class="quiz-op" onclick="verificarResposta(${i})">
      <span style="font-weight:700;min-width:18px">${String.fromCharCode(65+i)})</span> ${o}
    </button>
  `).join('');
  const vid = q.tema ? (videoMap[q.tema] || '') : '';
  const wrap = document.getElementById('q-video-wrap');
  if(vid){
    wrap.style.display = 'block';
    wrap.innerHTML = `<iframe width="100%" height="315" src="https://www.youtube.com/embed/${vid}" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen style="border-radius:12px;display:block;margin-top:10px"></iframe>`;
  } else {
    wrap.style.display = 'none';
    wrap.innerHTML = '';
  }
}

function verificarResposta(idx){
  if(respondeu) return;
  respondeu=true;
  const q = quizPerguntas[quizIdx];
  const btns = document.querySelectorAll('.quiz-op');
  btns.forEach((b,i)=>{
    b.disabled=true;
    if(i===q.c) b.classList.add('correta');
    else if(i===idx) b.classList.add('errada');
  });
  if(idx===q.c) quizCertas++; else quizErradas++;
  salvarRespostaQuiz(idx===q.c);
  document.getElementById('q-exp').textContent = q.exp;
  document.getElementById('q-exp').classList.add('show');
  document.getElementById('btn-prox-q').style.display='inline-block';
}

function proximaQuestao(){
  quizIdx++;
  renderQuestao();
}

function encerrarQuiz(){
  document.getElementById('quiz-box').style.display='none';
  const placar = document.getElementById('quiz-placar');
  placar.classList.add('show');
  const total = quizCertas+quizErradas;
  document.getElementById('placar-num').textContent = `${quizCertas}/${total}`;
  const pct = total?Math.round(quizCertas/total*100):0;
  document.getElementById('placar-label').textContent = `${pct}% de aproveitamento – ${quizCertas} certa(s), ${quizErradas} errada(s)`;
}

function salvarRespostaQuiz(acertou){
  const dados = JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');
  dados.quizTotal = (dados.quizTotal||0)+1;
  dados.quizCertas = (dados.quizCertas||0)+(acertou?1:0);
  localStorage.setItem(STORAGE_KEY,JSON.stringify(dados));
}

function renderExamesList(){
  const el = document.getElementById('exames-lista');
  el.innerHTML = EXAMES_DATA.map(e=>`
    <div class="exame-card">
      <div class="exame-info">
        <h3>${e.titulo}</h3>
        <p>${e.banca} · ${e.ano} · ${e.cargo}</p>
      </div>
      <button class="btn-iniciar" onclick="iniciarExame('${e.id}')">▶ Iniciar</button>
    </div>
  `).join('');
}

function iniciarExame(id){
  exAtual = EXAMES_DATA.find(e=>e.id===id);
  exSecAtual=0; exQAtual=0; exRespostas={}; exStarted=true;
  document.getElementById('exames-lista').style.display='none';
  const ativo = document.getElementById('exame-ativo');
  ativo.classList.add('show');
  document.getElementById('ex-titulo').textContent = exAtual.titulo;
  document.getElementById('ex-info').textContent = `${exAtual.banca} · ${exAtual.ano}`;
  document.getElementById('ex-resultado').classList.remove('show');
  document.getElementById('ex-corpo').style.display='block';
  renderQuestaoExame();
}

function renderQuestaoExame(){
  const sec = exAtual.secoes[exSecAtual];
  const q = sec.qs[exQAtual];
  document.getElementById('ex-sec-label').textContent = sec.nome;

  const pergEl = document.getElementById('ex-pergunta');
  pergEl.innerHTML = `<div style="display:flex;align-items:flex-start;gap:8px"><span style="flex:1"></span><button class="audio-btn" title="Ouvir pergunta">🔊</button></div>`;
  pergEl.querySelector('span').textContent = `Q${q.n}. ${q.q}`;
  pergEl.querySelector('.audio-btn').addEventListener('click', ()=>falar(`Q${q.n}. ${q.q}`));

  document.getElementById('ex-exp').classList.remove('show');
  document.getElementById('btn-ex-prox').style.display='none';

  const ops = document.getElementById('ex-ops');
  ops.innerHTML = q.ops.map((o,i)=>`
    <button class="ex-op" data-idx="${i}">
      <span style="font-weight:700;min-width:18px">${String.fromCharCode(65+i)})</span>
      <span style="flex:1"></span>
      <span class="audio-btn-op" data-audio="${i}" title="Ouvir alternativa">🔊</span>
    </button>
  `).join('');

  ops.querySelectorAll('.ex-op').forEach((btn, i)=>{
    btn.querySelector('span:nth-child(2)').textContent = q.ops[i];
    btn.addEventListener('click', (e)=>{
      if(e.target.classList.contains('audio-btn-op')) return;
      responderExame(i);
    });
    btn.querySelector('.audio-btn-op').addEventListener('click', (e)=>{
      e.stopPropagation();
      falar(q.ops[i]);
    });
  });
}

function responderExame(idx){
  const sec = exAtual.secoes[exSecAtual];
  const q = sec.qs[exQAtual];
  const key = `${exSecAtual}_${exQAtual}`;
  if(exRespostas[key]!==undefined) return;
  exRespostas[key]=idx;
  const btns = document.querySelectorAll('.ex-op');
  btns.forEach((b,i)=>{
    b.disabled=true;
    if(i===q.g) b.classList.add('correta');
    else if(i===idx) b.classList.add('errada');
  });
  document.getElementById('ex-exp').textContent = q.exp;
  document.getElementById('ex-exp').classList.add('show');
  document.getElementById('btn-ex-prox').style.display='inline-block';
}

function avancarExame(){
  const sec = exAtual.secoes[exSecAtual];
  exQAtual++;
  if(exQAtual>=sec.qs.length){
    exSecAtual++;
    exQAtual=0;
    if(exSecAtual>=exAtual.secoes.length){finalizarExame();return;}
  }
  renderQuestaoExame();
}

function finalizarExame(){
  document.getElementById('ex-corpo').style.display='none';
  let total=0,certas=0;
  exAtual.secoes.forEach((s,si)=>{
    s.qs.forEach((q,qi)=>{
      total++;
      if(exRespostas[`${si}_${qi}`]===q.g) certas++;
    });
  });
  document.getElementById('ex-res-num').textContent = `${certas}/${total}`;
  const pct=Math.round(certas/total*100);
  document.getElementById('ex-res-label').textContent = `${pct}% de aproveitamento`;
  document.getElementById('ex-resultado').classList.add('show');
  salvarResultadoSimulado(certas,total);
}

function salvarResultadoSimulado(certas,total){
  const dados = JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');
  dados.simTotal = (dados.simTotal||0)+1;
  dados.simCertas = (dados.simCertas||0)+certas;
  dados.simQuestoes = (dados.simQuestoes||0)+total;
  localStorage.setItem(STORAGE_KEY,JSON.stringify(dados));
}

function voltarExames(){
  document.getElementById('exame-ativo').classList.remove('show');
  document.getElementById('exames-lista').style.display='grid';
  exAtual=null; exStarted=false;
}

function mostrarRelatorio(){
  const dados = JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');
  const qT=dados.quizTotal||0, qC=dados.quizCertas||0;
  const sT=dados.simTotal||0, sC=dados.simCertas||0, sQ=dados.simQuestoes||0;
  const grid = document.getElementById('stats-grid');
  grid.innerHTML = `
    <div class="stat-card"><div class="stat-num">${qT}</div><div class="stat-label">Quiz respondidas</div></div>
    <div class="stat-card"><div class="stat-num">${qT?Math.round(qC/qT*100):0}%</div><div class="stat-label">Acerto no Quiz</div></div>
    <div class="stat-card"><div class="stat-num">${sT}</div><div class="stat-label">Simulados feitos</div></div>
    <div class="stat-card"><div class="stat-num">${sQ?Math.round(sC/sQ*100):0}%</div><div class="stat-label">Acerto Simulados</div></div>
  `;
}

function exportarTXT(){
  const dados = JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');
  const qT=dados.quizTotal||0,qC=dados.quizCertas||0;
  const sT=dados.simTotal||0,sC=dados.simCertas||0,sQ=dados.simQuestoes||0;
  const txt=`RELATÓRIO – Professor de Geografia
Gerado em: ${new Date().toLocaleString('pt-BR')}

QUIZ
  Questões respondidas: ${qT}
  Acertos: ${qC} (${qT?Math.round(qC/qT*100):0}%)
  Erros: ${qT-qC}

SIMULADOS
  Simulados realizados: ${sT}
  Questões respondidas: ${sQ}
  Acertos: ${sC} (${sQ?Math.round(sC/sQ*100):0}%)

---
Bons estudos! 🌍
`;
  const a=document.createElement('a');
  a.href='data:text/plain;charset=utf-8,'+encodeURIComponent(txt);
  a.download='relatorio-geografia.txt';
  a.click();
  toast('Exportado com sucesso!');
}

function limparDados(){
  if(!confirm('Limpar todo o histórico de respostas?')) return;
  localStorage.removeItem(STORAGE_KEY);
  mostrarRelatorio();
  toast('Dados apagados!');
}

function mudarTab(id,el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('ativo'));
  el.classList.add('ativo');
  document.querySelectorAll('.secao').forEach(s=>s.classList.remove('ativa'));
  document.getElementById('sec-'+id).classList.add('ativa');
  if(id==='relatorio') mostrarRelatorio();
}

function setSpeed(v, btn){
  _speechRate = v;
  document.querySelectorAll('.speed-btn').forEach(b=>b.classList.remove('ativo'));
  btn.classList.add('ativo');
}

function toggleDark(){
  const dark = document.body.hasAttribute('data-dark');
  dark ? document.body.removeAttribute('data-dark') : document.body.setAttribute('data-dark','');
  localStorage.setItem('geografiaDark', dark?'0':'1');
}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}
</script>
</body>
</html>
